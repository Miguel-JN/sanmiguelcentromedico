<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>San Miguel Centro Médico · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Mundo visual único: noche clínica, vidrio esmerilado, aqua médico + oro para el reparto */
  --bg:#04121a; --bg-2:#072029;
  --glass:rgba(255,255,255,.055); --glass-hi:rgba(255,255,255,.09); --line:rgba(190,240,240,.12); --line-2:rgba(190,240,240,.2);
  --text:#e9f5f5; --muted:#8ea8ad; --faint:#5d777c;
  --accent:#40d4e6; --accent-2:#38bdf8; --gold:#f2c879;
  --good:#34d399; --warn:#fbbf24; --bad:#fb7185; --wa:#25d366;
  --font-display:'Sora', 'Segoe UI', system-ui, sans-serif;
  --font-body:'Manrope', 'Segoe UI', system-ui, sans-serif;
  --r:20px; color-scheme:dark;
  /* Layout: barra lateral de vidrio + lienzo de tarjetas en rejilla */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
a{color:var(--accent)}

/* Fondo aurora */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:
  radial-gradient(1200px 700px at 85% -10%, #0b3a44 0%, transparent 60%),
  radial-gradient(900px 600px at -10% 110%, #0a2c3d 0%, transparent 60%), var(--bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:float 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;background:#0fb5a0;left:55%;top:-140px}
.aurora i:nth-child(2){width:440px;height:440px;background:#1678b8;left:-120px;top:45%;animation-duration:28s}
.aurora i:nth-child(3){width:360px;height:360px;background:#b88a3a;right:-120px;bottom:-120px;opacity:.18;animation-duration:32s}
.aurora::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000,transparent 80%)}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.1)}100%{transform:translate(-40px,80px) scale(.95)}}

/* Estructura */
.app{position:relative;z-index:1;display:grid;grid-template-columns:252px 1fr;height:100%}
.side{margin:14px 0 14px 14px;padding:20px 14px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 14px;border-bottom:1px solid var(--line)}
.brand .logo{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 30% 20%,rgba(64,212,230,.22),rgba(255,255,255,.03));border:1px solid var(--line-2);box-shadow:0 0 24px -6px rgba(64,212,230,.5)}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand b{font-family:var(--font-display);font-size:14.5px;line-height:1.15;display:block}
.brand small{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;position:relative;transition:background .25s,color .25s}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav a.on{color:var(--text);background:linear-gradient(90deg,rgba(64,212,230,.16),rgba(64,212,230,.02));box-shadow:inset 0 0 0 1px rgba(64,212,230,.18)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.nav a .badge{margin-left:auto;font-size:11px;background:rgba(37,211,102,.16);color:var(--wa);padding:1px 8px;border-radius:99px}
.split-mini{margin-top:auto;padding:14px;border-radius:16px;background:rgba(242,200,121,.06);border:1px solid rgba(242,200,121,.18)}
.split-mini .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.split-mini .bar{display:flex;height:8px;border-radius:8px;overflow:hidden;margin:10px 0 8px}
.split-mini .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.split-mini .row b{color:var(--text)}

.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:14px;padding:22px 30px 14px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:600}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.content{flex:1;overflow-y:auto;padding:6px 30px 40px;scroll-behavior:smooth}
.content::-webkit-scrollbar,.side::-webkit-scrollbar{width:10px}
.content::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* Vidrio */
.glass{position:relative;background:linear-gradient(150deg,rgba(255,255,255,.085),rgba(255,255,255,.022));border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 60px -30px rgba(0,0,0,.7)}
.card{padding:20px;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(64,212,230,.10),transparent 45%)}
.card:hover::before{opacity:1}
.card.lift:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 30px 70px -30px rgba(0,0,0,.85),0 0 0 1px rgba(64,212,230,.06)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:15px;font-weight:600}
.card-h .hint{color:var(--muted);font-size:12px}
.card-h .sp{flex:1}

.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.stack{display:flex;flex-direction:column;gap:18px}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px;min-height:150px;padding-bottom:0}
.kpi .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.kpi .ic svg{width:17px;height:17px}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.25}
.kpi .v{font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi .row{display:flex;align-items:center;gap:8px}
.kpi .spark{display:block;margin:auto -20px 0;width:calc(100% + 40px);height:42px;opacity:.9;pointer-events:none}
.kpi:not(:has(.spark)){padding-bottom:20px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.delta.up{color:var(--good);background:rgba(52,211,153,.12)}
.delta.down{color:var(--bad);background:rgba(251,113,133,.12)}
.delta.flat{color:var(--muted);background:rgba(255,255,255,.06)}
.delta svg{width:12px;height:12px}
.vs{color:var(--faint);font-size:11.5px}

/* Botones y controles */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:rgba(255,255,255,.06);padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;transition:background .2s,transform .15s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn.pri{background:linear-gradient(135deg,#40d4e6,#38bdf8);color:#042029;border-color:transparent;box-shadow:0 10px 30px -10px rgba(64,212,230,.6)}
.btn.pri:hover{box-shadow:0 14px 34px -10px rgba(64,212,230,.85);filter:brightness(1.06)}
.btn.wa{background:rgba(37,211,102,.14);border-color:rgba(37,211,102,.35);color:#7ff0a8}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.06)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.icon{padding:7px;border-radius:10px}
.btn.danger:hover{color:var(--bad);border-color:rgba(251,113,133,.4)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;padding:4px;gap:2px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;transition:all .25s}
.seg button.on{background:rgba(64,212,230,.16);color:var(--text);box-shadow:inset 0 0 0 1px rgba(64,212,230,.3)}
.input,select.input{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:rgba(64,212,230,.5);box-shadow:0 0 0 4px rgba(64,212,230,.1)}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{padding-left:34px;width:260px}

/* Menú desplegable */
.dd{position:relative}
.dd-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;padding:8px;z-index:30;display:none;background:rgba(9,32,40,.92)}
.dd.open .dd-menu{display:block;animation:pop .2s ease}
.dd-menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;text-align:left}
.dd-menu button:hover{background:rgba(255,255,255,.07)}
.dd-menu svg{width:16px;height:16px;color:var(--accent)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}

/* Banner de modo */
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:18px;border-radius:16px;font-size:13px;background:linear-gradient(90deg,rgba(242,200,121,.13),rgba(242,200,121,.04));border:1px solid rgba(242,200,121,.28)}
.banner .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);flex:none}
.banner.live{background:linear-gradient(90deg,rgba(52,211,153,.1),rgba(52,211,153,.02));border-color:rgba(52,211,153,.25)}
.banner.live .dot{background:var(--good);box-shadow:0 0 10px var(--good)}
.banner.err{background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.3)}
.banner.err .dot{background:var(--bad)}
.banner .sp{flex:1}

/* Tablas */
.tw{overflow-x:auto;margin:0 -20px -20px;padding:0 20px 8px}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
.tbl tr{transition:background .2s}
.tbl tbody tr:hover{background:rgba(255,255,255,.035)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.act{text-align:right;white-space:nowrap;width:1%}
.tbl .act .btn{opacity:.55}
.tbl tr:hover .act .btn{opacity:1}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;color:#04121a}
.who b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{font-size:11.5px;color:var(--muted);padding:2px 8px;border-radius:7px;background:rgba(255,255,255,.06);white-space:nowrap}
.muted{color:var(--muted)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-family:var(--font-display);font-size:15px;margin-bottom:4px}
.more{display:flex;justify-content:center;padding-top:14px}

/* Gráficas */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--faint);font-size:11px;font-family:var(--font-body)}
.chart .gl{stroke:rgba(255,255,255,.06)}
.tip{position:absolute;pointer-events:none;z-index:5;padding:10px 12px;border-radius:12px;font-size:12px;min-width:150px;background:rgba(6,24,31,.92);border:1px solid var(--line-2);backdrop-filter:blur(10px);box-shadow:0 14px 40px -12px #000;opacity:0;transition:opacity .15s;transform:translate(-50%,-110%)}
.tip.on{opacity:1}
.tip b{display:block;font-family:var(--font-display);margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.bars{display:flex;flex-direction:column;gap:12px}
.bars .b-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bars .b-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px}
.bars .b-row em{font-style:normal;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.bars .track{grid-column:1/-1;height:8px;border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 60%,#fff));box-shadow:0 0 14px -2px var(--c,var(--accent))}

/* Donut reparto */
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.donut{position:relative;width:200px;height:200px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .ctr small{color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.donut .ctr b{font-family:var(--font-display);font-size:22px;font-weight:600}
.partners{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.partner{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-top:2px solid var(--c)}
.partner small{color:var(--muted);font-size:12px;font-weight:600;display:flex;justify-content:space-between}
.partner b{font-family:var(--font-display);font-size:19px;font-weight:600;display:block;margin-top:2px}

/* Embudo */
.funnel{display:flex;flex-direction:column;gap:10px}
.fstep{position:relative;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.fstep .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 40%,transparent),color-mix(in srgb,var(--c) 10%,transparent));border-right:2px solid var(--c)}
.fstep span,.fstep b{position:relative;z-index:1}
.fstep span{font-weight:600;font-size:13px}
.fstep b{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.fstep b small{color:var(--muted);font-family:var(--font-body);font-weight:600;font-size:11.5px;margin-left:6px}

/* Lista de citas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.li:last-child{border-bottom:0}
.li .time{width:58px;flex:none;text-align:center;border-radius:11px;padding:5px 0;background:rgba(64,212,230,.08);border:1px solid rgba(64,212,230,.18)}
.li .time b{display:block;font-family:var(--font-display);font-size:13.5px}
.li .time small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow small{color:var(--muted)}

/* Calendario */
.cal-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-h h3{font-size:19px;text-transform:capitalize;min-width:170px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center;padding-bottom:4px;font-weight:700}
.day{min-height:104px;border-radius:13px;padding:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:background .2s,border-color .2s,transform .2s;text-align:left;min-width:0}
.day:hover{background:rgba(255,255,255,.07);border-color:var(--line-2)}
.day.out{opacity:.35}
.day .dn{font-family:var(--font-display);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.day .dn em{font-style:normal;font-size:10.5px;color:var(--muted);font-family:var(--font-body)}
.day.today .dn span{background:var(--accent);color:#042029;border-radius:7px;padding:0 6px}
.day.sel{border-color:rgba(64,212,230,.6);background:rgba(64,212,230,.09);box-shadow:0 0 0 3px rgba(64,212,230,.08)}
.day .ev{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,transparent);border-left:2px solid var(--c)}
.day .heat{height:3px;border-radius:3px;margin-top:auto;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.heatmap{display:grid;gap:4px;font-size:11px}
.heatmap .hc{height:24px;border-radius:6px;background:rgba(64,212,230,var(--a));transition:transform .2s}
.heatmap .hc:hover{transform:scale(1.15);outline:1px solid var(--accent)}
.heatmap .hl{color:var(--faint);display:flex;align-items:center;justify-content:center}

/* Servicios */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.svc .price{font-family:var(--font-display);font-size:24px;font-weight:600}
.svc .meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.svc .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.svc .stats small{color:var(--muted);font-size:11.5px;display:block}
.svc .stats b{font-family:var(--font-display);font-weight:600}
.svc .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);margin-bottom:12px}

/* Utilidades */
.hero-split{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px}
.big{font-family:var(--font-display);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.paid{cursor:pointer;border:0}

/* Modal */
.mback{position:fixed;inset:0;z-index:50;background:rgba(2,10,14,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s ease}
.modal{width:min(620px,100%);max-height:calc(100% - 20px);overflow-y:auto;padding:24px;background:linear-gradient(150deg,rgba(14,48,58,.94),rgba(6,26,33,.96));animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.modal-h h2{font-size:20px;font-weight:600}
.modal-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.modal-h .sp{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.span2{grid-column:1/-1}
.fld>span{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:rgba(64,212,230,.55);box-shadow:0 0 0 4px rgba(64,212,230,.1)}
.fld select option{background:#0a2730}
.form-f{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}

/* Toast */
.toasts{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:14px;font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center;background:rgba(8,34,42,.94);border:1px solid var(--line-2);box-shadow:0 18px 40px -14px #000;animation:rise .3s ease}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.toast.err i{background:var(--bad)}

/* Entradas animadas */
.enter .rv{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
.enter .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.4,0,.2,1) .2s forwards}
.enter .areaf{animation:fade 1.2s ease .5s both}
.enter .bar-fill{animation:barw 1.1s cubic-bezier(.2,.8,.2,1) both}
.enter .fstep .fill{animation:barw 1.1s cubic-bezier(.2,.8,.2,1) both}
.enter .arc{animation:arc 1.4s cubic-bezier(.2,.8,.2,1) .15s both}
.enter .vbar{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom;transform-box:fill-box}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes barw{from{width:0}}
@keyframes arc{from{stroke-dasharray:0 var(--c)}}
@keyframes grow{from{transform:scaleY(0)}}

.mobile-only{display:none}
@media (max-width:1180px){
  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-split{grid-template-columns:1fr 1fr}
  .hero-split>:first-child{grid-column:1/-1}
}
@media (max-width:960px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100%}
  .side{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:40;flex-direction:row;padding:8px;border-radius:18px 18px 0 0;overflow-x:auto;gap:0}
  .side .brand,.side .split-mini,.nav .lbl{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav a{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 10px;min-width:64px}
  .nav a.on::before{display:none}
  .nav a .badge{display:none}
  .main{height:auto}
  .content{overflow:visible;padding:4px 16px 110px}
  .top{padding:18px 16px 12px}
  .g-2-1,.g-2,.g-3,.g-1-2,.hero-split{grid-template-columns:minmax(0,1fr)}
  .search input{width:100%}
  .mobile-only{display:flex}
  .day{min-height:64px;padding:5px}
  .day .ev{display:none}
}
@media (max-width:520px){
  .form{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:20px}
  .top h1{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .draw{stroke-dashoffset:0!important}
}
</style>
</head>

const PERIODS=[['mes','Este mes'],['mesAnt','Mes anterior'],['30d','30 días'],['90d','90 días'],['anio','Este año']];
function range(p){const t=today(),y=t.getFullYear(),m=t.getMonth();
  switch(p){case 'mes':return{a:new Date(y,m,1),b:new Date(y,m+1,0)};

    case 'anio':return{a:new Date(y,0,1),b:new Date(y,11,31)}}}
function prevRange(p){const t=today(),y=t.getFullYear(),m=t.getMonth();
  if(p==='mes'){const end=new Date(y,m,0);return{a:new Date(y,m-1,1),b:new Date(y,m-1,Math.min(t.getDate(),end.getDate()))}}
  if(p==='mesAnt')return{a:new Date(y,m-2,1),b:new Date(y,m-1,0)};
  if(p==='anio')return{a:new Date(y-1,0,1),b:new Date(y-1,m,t.getDate())};
  const r=range(p),n=dayDiff(r.a,r.b)+1;return{a:addDays(r.a,-n),b:addDays(r.a,-1)}}
const inR=(s,r)=>s>=ymd(r.a)&&s<=ymd(r.b);
const capR=r=>({a:r.a,b:r.b>today()?today():r.b});
function periodLabel(p){const r=range(p);if(p==='mes'||p==='mesAnt')return MESL[r.a.getMonth()]+' '+r.a.getFullYear();if(p==='anio')return 'Año '+r.a.getFullYear();return fdateS(ymd(r.a))+' – '+fdateS(ymd(r.b))}
function buckets(r){const days=dayDiff(r.a,r.b)+1;const out=[];
  if(days<=45){for(let i=0;i<days;i++){const d=addDays(r.a,i);out.push({a:ymd(d),b:ymd(d),label:d.getDate()+' '+MES[d.getMonth()],short:String(d.getDate())})}}
  else if(days<=130){let d=new Date(r.a);while(d<=r.b){const e=addDays(d,6)>r.b?r.b:addDays(d,6);out.push({a:ymd(d),b:ymd(e),label:'Semana del '+fdateS(ymd(d)),short:fdateS(ymd(d))});d=addDays(e,1)}}

let CHARTS={};let chartN=0;
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function lineChart({labels,full,series:ss,h=260,fmt=compact,tipFmt=money,type='area'}){
  const id='ch'+(chartN++);const W=760,H=h,pl=46,pr=12,pt=14,pb=28;
  const max=niceMax(Math.max(1,...ss.flatMap(s=>s.values)));const n=labels.length;
  const x=i=>pl+(n<=1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  const step=Math.max(1,Math.ceil(n/9));let xl='';labels.forEach((l,i)=>{if(i%step===0||i===n-1&&n<12)xl+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  let body='',defs='';

  else ss.forEach((s,si)=>{const pts=s.values.map((v,i)=>[x(i),y(v)]);
    let d='';pts.forEach((p,i)=>{if(!i){d+=`M${p[0]},${p[1]}`;return}const q=pts[i-1];const cx=(q[0]+p[0])/2;d+=` C${cx},${q[1]} ${cx},${p[1]} ${p[0]},${p[1]}`});
    defs+=`<linearGradient id="${id}g${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".32"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
    if(type==='area'&&pts.length)body+=`<path class="areaf" d="${d} L${x(n-1)},${H-pb} L${x(0)},${H-pb}Z" fill="url(#${id}g${si})"/>`;
    body+=`<path class="draw" pathLength="1" d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linecap="round" ${s.dash?'stroke-dasharray="4 5"':''}/>`;

  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica"><defs>${defs}</defs>${g}${xl}${body}<line class="cur" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="rgba(255,255,255,.25)" stroke-dasharray="3 4" opacity="0"/></svg><div class="tip"></div></div>`}
function bindCharts(){$$('[data-chart]').forEach(el=>{const c=CHARTS[el.dataset.chart];if(!c)return;const svg=$('svg',el),tip=$('.tip',el),cur=$('.cur',el);
  el.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect();const sx=(e.clientX-r.left)/r.width*c.W;let i=Math.round((sx-c.pl)/((c.W-c.pl-c.pr)/Math.max(1,c.n-1)));i=Math.max(0,Math.min(c.n-1,i));
    const xx=c.pl+(c.n<=1?(c.W-c.pl-c.pr)/2:i*(c.W-c.pl-c.pr)/(c.n-1));cur.setAttribute('x1',xx);cur.setAttribute('x2',xx);cur.setAttribute('opacity',1);

function vAgenda(){const d=D();const m=S.agenda;const y=m.getFullYear(),mo=m.getMonth();

  const cells=[];for(let i=0;i<42;i++){const dd=addDays(start,i);cells.push(dd);if(i>=35&&dd.getMonth()!==mo&&i%7===0)break}
  const vis=cells.slice(0,cells.length-(cells.length%7?cells.length%7:0));
  const byDay={};d.citas.forEach(c=>{(byDay[c.fecha]=byDay[c.fecha]||[]).push(c)});
  const maxDay=Math.max(1,...vis.map(x=>(byDay[ymd(x)]||[]).filter(c=>c.estado!=='Cancelada').length));
  const sel=(byDay[S.selDay]||[]).sort((a,b)=>a.hora.localeCompare(b.hora));const sd=parse(S.selDay);
  const monthC=d.citas.filter(c=>c.fecha.slice(0,7)===`${y}-${pad(mo+1)}`);
  const past=monthC.filter(c=>c.fecha<=TODAY&&['Atendida','No asistió'].includes(c.estado));const asis=past.length?past.filter(c=>c.estado==='Atendida').length/past.length:0;
  const canc=monthC.length?monthC.filter(c=>c.estado==='Cancelada').length/monthC.length:0;
  const h90=d.citas.filter(c=>c.estado!=='Cancelada'&&c.fecha>=ymd(addDays(today(),-89))&&c.fecha<=TODAY);

  const hm={};h90.forEach(c=>{const k=parse(c.fecha).getDay()+'-'+parseInt(c.hora);hm[k]=(hm[k]||0)+1});const hmax=Math.max(1,...Object.values(hm));
  const dwC=dows.map(i=>({k:DOWL[i][0].toUpperCase()+DOWL[i].slice(1),v:h90.filter(c=>parse(c.fecha).getDay()===i).length,c:'#38bdf8'}));
  const vsel=new Set(d.ventas.map(v=>v.citaId).filter(Boolean));

    ${kpi({l:'Tasa de asistencia',v:asis,f:x=>pct(x,0),i:'check',c:'#34d399',sub:'Atendidas vs. no asistió',idx:1})}
    ${kpi({l:'Cancelaciones',v:canc,f:x=>pct(x,0),i:'x',c:'#fb7185',sub:'Del total agendado en el mes',idx:2})}
    ${kpi({l:'Por confirmar',v:d.citas.filter(c=>c.fecha>=TODAY&&c.estado==='Agendada').length,f:intf,i:'phone',c:'#fbbf24',sub:'Citas futuras sin confirmar',idx:3})}

    <div class="glass card rv" style="--i:4"><div class="cal-h"><button class="btn icon" data-act="mprev" aria-label="Mes anterior">${ic('left')}</button><h3>${MESL[mo]} ${y}</h3><button class="btn icon" data-act="mnext" aria-label="Mes siguiente">${ic('right')}</button><button class="btn sm ghost" data-act="mtoday">Hoy</button><span style="flex:1"></span><button class="btn sm pri" data-act="new-cita">${ic('plus')}Nueva cita</button></div>
      <div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="dow">${x}</div>`).join('')}
      ${vis.map(dd=>{const k=ymd(dd);const cs=(byDay[k]||[]).sort((a,b)=>a.hora.localeCompare(b.hora));const act=cs.filter(c=>c.estado!=='Cancelada');
        return `<button class="day ${dd.getMonth()!==mo?'out':''} ${k===TODAY?'today':''} ${k===S.selDay?'sel':''}" data-act="selday" data-day="${k}"><div class="dn"><span>${dd.getDate()}</span>${act.length?`<em>${act.length} cita${act.length>1?'s':''}</em>`:''}</div>

    <div class="glass card rv" style="--i:5">${cardH(`${DOWL[sd.getDay()][0].toUpperCase()+DOWL[sd.getDay()].slice(1)} ${sd.getDate()} de ${MESL[sd.getMonth()]}`,sel.length+' citas',`<button class="btn icon" data-act="new-cita" data-day="${S.selDay}" aria-label="Agregar cita">${ic('plus')}</button>`)}

  </div>

let lastView=null,rq=0;
function render(){const enter=lastView!==S.view;lastView=S.view;chartN=0;CHARTS={};
  const ae=document.activeElement;const fid=ae&&ae.id&&$('#content').contains(ae)?ae.id:null;const sel=fid&&ae.selectionStart;
  renderSide();renderTop();const c=$('#content');
  c.innerHTML=banner()+RENDER[S.view]();
  if(enter){c.classList.remove('enter');void c.offsetWidth;c.classList.add('enter');clearTimeout(render.t);render.t=setTimeout(()=>c.classList.remove('enter'),2200);c.scrollTop=0;countUp()}
  bindCharts();bindView();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}}
function scheduleRender(){cancelAnimationFrame(rq);rq=requestAnimationFrame(render)}
function countUp(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;$$('.kpi .v,.big,.donut .ctr b,.partner b').forEach(el=>{const txt=el.textContent;const m=txt.match(/-?[\d,]+(\.\d+)?/);if(!m)return;const target=parseFloat(m[0].replace(/,/g,''));if(!target)return;const dec=(m[1]||'').length-1;const t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/1000);const e=1-Math.pow(1-k,3);const v=target*e;el.textContent=txt.replace(m[0],dec>0?v.toLocaleString('es-MX',{minimumFractionDigits:dec,maximumFractionDigits:dec}):Math.round(v).toLocaleString('es-MX'));if(k<1)requestAnimationFrame(step);else el.textContent=txt};requestAnimationFrame(step)})}
function bindView(){const q=$('#q');if(q)q.oninput=()=>{S.q=q.value;S.limit=40;scheduleRender()};const fo=$('#forigen');if(fo)fo.onchange=()=>{S.origen=fo.value;render()};
  const f=$('#cfgform');if(f){const r=$('#c_pct');r.oninput=()=>{$('#pctv').textContent=r.value+'% / '+(100-r.value)+'%'};
    f.onsubmit=e=>{e.preventDefault();saveCfg({direccion:$('#c_dir').value.trim(),whatsapp:$('#c_wa').value.trim(),telefono:$('#c_tel').value.trim(),instagram:$('#c_ig').value.trim(),apertura:$('#c_ap').value,clinica:$('#c_clinica').value.trim()||DEFAULT_CFG.clinica,socioNombre:$('#c_socio').value.trim()||'Socio',miNombre:$('#c_mi').value.trim()||'Yo',socioPct:+r.value,moneda:$('#c_mon').value})}}
  const lf=$('#logof');if(lf)lf.onchange=()=>{const file=lf.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,256/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);saveCfg({logo:cv.toDataURL('image/png')})};img.onerror=()=>toast('No se pudo leer la imagen. Prueba con PNG o JPG.',true);img.src=rd.result};rd.readAsDataURL(file)}}

/* ================= Persistencia ================= */
const P=col=>'clinica/smcm/'+col;
const LKEY='smcm-panel-v1';
function persistLocal(){try{localStorage.setItem(LKEY,JSON.stringify({cfg:S.cfg,data:LIVE}));return true}catch(e){toast('El navegador no permitió guardar. Revisa que no esté en modo privado.',true);return false}}
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LKEY)||'null');if(!j)return false;if(j.cfg)S.cfg={...DEFAULT_CFG,...j.cfg};COLS.forEach(c=>{if(Array.isArray(j.data?.[c]))LIVE[c]=j.data[c]});return true}catch(e){return false}}
const isLocal=()=>!db&&S.dbState==='local';
let db=null;
async function save(col,obj){obj={...obj};if(!obj.id)obj.id=uid();const arr=D()[col];
  if(S.mode==='demo'||!db){const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);render();if(S.mode==='demo')toast('Guardado en modo ejemplo (no se conserva)');else if(isLocal()&&persistLocal())toast('Guardado');return obj}
  const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);scheduleRender();
  try{const {id,...body}=obj;await db.collection(P(col)).doc(id).set(body);toast('Guardado')}catch(e){dbErr(e)}return obj}
async function remove(col,id){const arr=D()[col];const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);render();
  if(S.mode==='live'&&db){try{await db.collection(P(col)).doc(id).delete();toast('Eliminado')}catch(e){dbErr(e)}}else{if(S.mode==='live'&&isLocal())persistLocal();toast('Eliminado')}}
async function saveCfg(patch){S.cfg={...S.cfg,...patch};render();if(db){try{await db.doc(P('config')+'/general').set({...S.cfg});toast('Ajustes guardados')}catch(e){dbErr(e)}}else if(isLocal()){if(persistLocal())toast('Ajustes guardados')}else toast('Ajustes aplicados (sin guardar)')}
function dbErr(e){const c=e&&e.code;if(c==='invalid_argument'){S.canWrite=false;toast('No tienes permiso para guardar cambios en esta plataforma.',true)}else if(c==='quota_exceeded')toast('Se alcanzó el límite de almacenamiento. Elimina registros antiguos.',true);else toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.',true)}

async function initDb(){let d=null;try{d=await window.claude?.use?.('db')}catch(e){}
  if(!d){let ok=true;try{localStorage.setItem(LKEY+'-t','1');localStorage.removeItem(LKEY+'-t')}catch(e){ok=false}
    if(!ok){S.dbState='none';render();return}S.dbState='local';loadLocal();if((OPS.some(c=>LIVE[c].length)||S.cfg.iniciado)&&!S.pickedDemo)S.mode='live';render();return}db=d;S.db=d;
  const pending=new Set([...COLS,'config']);let timer=setTimeout(()=>{if(pending.size){S.dbState='slow';render()}},10000);
  const done=(k,fromCache)=>{if(!fromCache)pending.delete(k);if(!pending.size&&S.dbState!=='ready'){clearTimeout(timer);S.dbState='ready';
    const has=OPS.some(c=>LIVE[c].length)||S.cfg.iniciado;if(has&&!S.pickedDemo)S.mode='live'}scheduleRender()};
  COLS.forEach(col=>{db.collection(P(col)).onSnapshot(snap=>{LIVE[col]=snap.docs.map(x=>({...x.data(),id:x.id}));done(col,snap.metadata.fromCache)},err=>{pending.delete(col);if(err.code!=='revoked'){S.dbState=pending.size?S.dbState:'ready'}scheduleRender()})});
  db.doc(P('config')+'/general').onSnapshot(snap=>{if(snap.exists)S.cfg={...DEFAULT_CFG,...snap.data()};done('config',snap.metadata.fromCache)},()=>{pending.delete('config');scheduleRender()})}

function closeModal(){$('#modal-root').innerHTML=''}
function modal(html,wide){$('#modal-root').innerHTML=`<div class="mback" data-act="mclose-bg"><div class="glass modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#modal-root input,#modal-root select');if(f)f.focus()}
function fld(f){const id='f_'+f.id;const cls=`fld ${f.span?'span2':''}`;
  if(f.type==='select')return `<label class="${cls}"><span>${f.label}</span><select id="${id}">${f.options.map(o=>{const v=typeof o==='object'?o.v:o,t=typeof o==='object'?o.t:o;return `<option value="${esc(v)}" ${String(v)===String(f.value??'')?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;
  if(f.type==='textarea')return `<label class="${cls}"><span>${f.label}</span><textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(f.value||'')}</textarea></label>`;
  return `<label class="${cls}"><span>${f.label}</span><input id="${id}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.list?`list="${f.list}"`:''} ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.req?'required':''} placeholder="${esc(f.ph||'')}" autocomplete="off"></label>`}
function form({title,sub,fields,ok='Guardar',onSubmit,onOpen,extra=''}){
  modal(`<div class="modal-h"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div><span class="sp"></span><button class="btn icon ghost" data-act="mclose" aria-label="Cerrar">${ic('x')}</button></div>
  <form class="form" id="mform">${fields.map(fld).join('')}${extra}<div class="form-f"><button type="button" class="btn ghost" data-act="mclose">Cancelar</button><button class="btn pri" type="submit">${ic('check')}${ok}</button></div></form>`);
  $('#mform').onsubmit=async e=>{e.preventDefault();const v={};fields.forEach(f=>v[f.id]=$('#f_'+f.id).value);const r=await onSubmit(v);if(r!==false)closeModal()};onOpen&&onOpen()}
const pacList=()=>`<datalist id="dl-pac">${D().pacientes.map(p=>`<option value="${esc(p.nombre)}">`).join('')}</datalist>`;
const svcOpts=()=>D().servicios.map(s=>({v:s.id,t:`${s.nombre}${+s.precio?' · '+money(s.precio):''}`}));
async function ensurePac(nombre,extra={}){nombre=nombre.trim();if(!nombre)return null;const ex=D().pacientes.find(p=>p.nombre.toLowerCase()===nombre.toLowerCase());if(ex)return ex.id;
  const p=await save('pacientes',{nombre,telefono:extra.telefono||'',email:'',origen:extra.origen||'WhatsApp',nacimiento:'',notas:'',creado:TODAY});return p.id}

function fVenta(v={},cita){const d=D();const isNew=!v.id;const s0=v.servicioId||cita?.servicioId||d.servicios[0]?.id||'';
  form({title:isNew?'Registrar venta':'Editar venta',sub:'Cobro a un paciente',extra:pacList(),fields:[
    {id:'fecha',label:'Fecha',type:'date',value:v.fecha||cita?.fecha||TODAY,req:1},{id:'metodo',label:'Método de pago',type:'select',options:METODOS,value:v.metodo||'Efectivo'},
    {id:'paciente',label:'Paciente',list:'dl-pac',value:v.pacienteId?pName(v.pacienteId):cita?pName(cita.pacienteId):'',ph:'Escribe o elige un paciente',req:1,span:1},
    {id:'servicio',label:'Servicio',type:'select',options:[{v:'',t:'Otro concepto'},...svcOpts()],value:s0},{id:'monto',label:'Monto',type:'number',step:'0.01',min:0,value:v.monto??(byId('servicios',s0)?.precio||''),req:1},
    {id:'concepto',label:'Concepto (opcional)',value:v.concepto||'',ph:'Ej. consulta + estudio',span:1}],
    onOpen:()=>{$('#f_servicio').onchange=e=>{const s=byId('servicios',e.target.value);if(s)$('#f_monto').value=s.precio}},
    onSubmit:async x=>{const pid=await ensurePac(x.paciente);await save('ventas',{...v,fecha:x.fecha,pacienteId:pid,servicioId:x.servicio,concepto:x.concepto,monto:+x.monto||0,metodo:x.metodo,citaId:v.citaId||cita?.id||'',notas:v.notas||''})}})}
function fGasto(g={}){form({title:g.id?'Editar gasto':'Registrar gasto',sub:'Egreso de la clínica',fields:[
  {id:'concepto',label:'Concepto',value:g.concepto||'',ph:'Ej. Renta del local',req:1,span:1},{id:'fecha',label:'Fecha',type:'date',value:g.fecha||TODAY,req:1},
  {id:'monto',label:'Monto',type:'number',step:'0.01',min:0,value:g.monto??'',req:1},{id:'categoria',label:'Categoría',type:'select',options:CAT_G,value:g.categoria||'Insumos médicos'},
  {id:'metodo',label:'Método de pago',type:'select',options:METODOS,value:g.metodo||'Transferencia'},{id:'notas',label:'Notas',type:'textarea',value:g.notas||'',span:1}],
  onSubmit:x=>save('gastos',{...g,concepto:x.concepto,fecha:x.fecha,monto:+x.monto||0,categoria:x.categoria,metodo:x.metodo,notas:x.notas})})}
function fCita(c={},day){const d=D();form({title:c.id?'Editar cita':'Nueva cita',sub:'Si el paciente es nuevo, se agrega al directorio',extra:pacList(),fields:[
  {id:'paciente',label:'Paciente',list:'dl-pac',value:c.pacienteId?pName(c.pacienteId):'',ph:'Nombre completo',req:1,span:1},
  {id:'telefono',label:'Teléfono (si es nuevo)',type:'tel',value:'',ph:'415 123 4567'},{id:'origen',label:'¿Cómo llegó?',type:'select',options:ORIGENES,value:c.origen||'WhatsApp'},
  {id:'servicio',label:'Servicio',type:'select',options:svcOpts(),value:c.servicioId||d.servicios[0]?.id,span:1},
  {id:'fecha',label:'Fecha',type:'date',value:c.fecha||day||TODAY,req:1},{id:'hora',label:'Hora',type:'time',value:c.hora||'10:00',req:1},
  {id:'estado',label:'Estado',type:'select',options:Object.keys(ESTADOS),value:c.estado||'Agendada'},{id:'notas',label:'Notas',value:c.notas||'',ph:'Motivo, indicaciones…'}],
  onSubmit:async x=>{const pid=await ensurePac(x.paciente,{telefono:x.telefono,origen:x.origen});await save('citas',{...c,pacienteId:pid,servicioId:x.servicio,fecha:x.fecha,hora:x.hora,estado:x.estado,origen:x.origen,notas:x.notas});S.selDay=x.fecha;const dd=parse(x.fecha);S.agenda=new Date(dd.getFullYear(),dd.getMonth(),1)}})}
function fPac(p={}){form({title:p.id?'Editar paciente':'Nuevo paciente',fields:[
  {id:'nombre',label:'Nombre completo',value:p.nombre||'',req:1,span:1},{id:'telefono',label:'Teléfono / WhatsApp',type:'tel',value:p.telefono||''},{id:'email',label:'Correo',type:'email',value:p.email||''},
  {id:'origen',label:'¿Cómo llegó?',type:'select',options:ORIGENES,value:p.origen||'WhatsApp'},{id:'nacimiento',label:'Fecha de nacimiento',type:'date',value:p.nacimiento||''},{id:'notas',label:'Notas',type:'textarea',value:p.notas||'',span:1}],
  onSubmit:x=>save('pacientes',{...p,...x,nombre:x.nombre.trim(),creado:p.creado||TODAY})})}
function fWa(w={}){form({title:w.id?'Editar registro':'WhatsApp del día',sub:'Conversaciones nuevas que llegaron y cuántas agendaron',fields:[
  {id:'fecha',label:'Fecha',type:'date',value:w.fecha||TODAY,req:1,span:1},{id:'conversaciones',label:'Conversaciones nuevas',type:'number',min:0,value:w.conversaciones??'',req:1},{id:'agendaron',label:'Agendaron cita',type:'number',min:0,value:w.agendaron??'',req:1},{id:'notas',label:'Notas',value:w.notas||'',ph:'Ej. arrancó campaña de ultrasonido',span:1}],
  onSubmit:async x=>{if(+x.agendaron>+x.conversaciones){toast('“Agendaron” no puede ser mayor que las conversaciones.',true);return false}
    if(w.id&&w.id!==x.fecha)await remove('whatsapp',w.id);await save('whatsapp',{id:x.fecha,fecha:x.fecha,conversaciones:+x.conversaciones||0,agendaron:+x.agendaron||0,notas:x.notas})}})}
function fSvc(s={}){form({title:s.id?'Editar servicio':'Nuevo servicio',fields:[
  {id:'nombre',label:'Nombre',value:s.nombre||'',req:1,span:1},{id:'categoria',label:'Categoría',type:'select',options:CAT_S,value:s.categoria||'Consulta'},
  {id:'precio',label:'Precio (deja 0 si aún no se define)',type:'number',step:'0.01',min:0,value:s.precio??''},{id:'duracion',label:'Duración (min)',type:'number',min:5,value:s.duracion??30},{id:'horario',label:'Horario',value:s.horario||'',ph:'Ej. Martes y jueves · 8:00 am a 12:00 pm',span:1},{id:'descripcion',label:'Descripción',value:s.descripcion||'',span:1}],
  onSubmit:x=>save('servicios',{...s,nombre:x.nombre.trim(),categoria:x.categoria,precio:+x.precio||0,duracion:+x.duracion||30,horario:x.horario,descripcion:x.descripcion})})}
function verPac(id){const d=D();const p=byId('pacientes',id);if(!p)return;const cs=d.citas.filter(c=>c.pacienteId===id).sort((a,b)=>b.fecha.localeCompare(a.fecha));const vs=d.ventas.filter(v=>v.pacienteId===id);
  modal(`<div class="modal-h"><div class="who">${avatar(p.nombre)}<div><h2>${esc(p.nombre)}</h2><p>${esc(p.telefono||'Sin teléfono')}${p.email?' · '+esc(p.email):''}</p></div></div><span class="sp"></span><button class="btn icon ghost" data-act="mclose" aria-label="Cerrar">${ic('x')}</button></div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px">
    <div class="partner" style="--c:#40d4e6"><small>Total pagado</small><b class="num">${money(sum(vs,'monto'))}</b></div><div class="partner" style="--c:#38bdf8"><small>Visitas</small><b>${cs.filter(c=>c.estado==='Atendida').length}</b></div><div class="partner" style="--c:${ORIG_C[p.origen]||'#94a3b8'}"><small>Origen</small><b style="font-size:15px">${esc(p.origen)}</b></div></div>
  ${p.notas?`<p class="muted">${esc(p.notas)}</p>`:''}
  <h3 style="font-size:14px;margin:6px 0 8px">Historial de citas</h3>
  ${cs.length?`<div class="list">${cs.slice(0,12).map(c=>`<div class="li"><div class="time"><small>${MES[parse(c.fecha).getMonth()]} ${parse(c.fecha).getFullYear()%100}</small><b>${parse(c.fecha).getDate()}</b></div><div class="grow"><b>${esc(sName(c.servicioId))}</b><small>${esc(c.hora)}</small></div>${pill(c.estado)}</div>`).join('')}</div>`:'<div class="empty">Sin citas registradas</div>'}
  <div class="form-f" style="margin-top:16px"><button class="btn" data-act="edit-pac" data-id="${p.id}">${ic('edit')}Editar</button><button class="btn pri" data-act="new-cita-p" data-id="${p.id}">${ic('cal')}Agendar cita</button></div>`,true)}
function confirmDel(col,id){const names={ventas:'esta venta',gastos:'este gasto',citas:'esta cita',pacientes:'este paciente',servicios:'este servicio',whatsapp:'este registro'};
  modal(`<div class="modal-h"><div><h2>¿Eliminar ${names[col]}?</h2><p>Esta acción no se puede deshacer.</p></div></div><div class="form-f"><button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn pri" style="background:linear-gradient(135deg,#fb7185,#f43f5e);color:#fff" data-act="delok" data-col="${col}" data-id="${id}">${ic('trash')}Eliminar</button></div>`)}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.innerHTML=`<i></i>${esc(msg)}`;$('#toasts').appendChild(t);setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity=0;setTimeout(()=>t.remove(),400)},2800)}

/* ================= Eventos ================= */
document.addEventListener('click',async e=>{const pb=e.target.closest('[data-period]');if(pb){S.period=pb.dataset.period;S.limit=40;lastView=null;render();return}
  const el=e.target.closest('[data-act]');const dd=$('#dd');if(dd&&!e.target.closest('#dd'))dd.classList.remove('open');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;const d=D();
  if(a==='mclose-bg'){if(e.target===el)closeModal();return}
  if(a==='estado')return;
  if(el.tagName==='TR'&&e.target.closest('button'))return;
  if(dd&&el.closest('.dd-menu'))dd.classList.remove('open');
  switch(a){
    case 'dd':dd.classList.toggle('open');break;
    case 'mclose':closeModal();break;
    case 'new-venta':if(!d.servicios.length&&!d.pacientes.length){}fVenta();break;
    case 'edit-venta':fVenta(byId('ventas',id));break;
    case 'new-gasto':fGasto();break;case 'edit-gasto':fGasto(byId('gastos',id));break;
    case 'new-cita':fCita({},el.dataset.day);break;case 'edit-cita':fCita(byId('citas',id));break;
    case 'new-cita-p':closeModal();fCita({pacienteId:id,origen:byId('pacientes',id)?.origen});break;
    case 'cobrar':fVenta({},byId('citas',id));break;
    case 'new-pac':fPac();break;case 'edit-pac':closeModal();fPac(byId('pacientes',id));break;case 'ver-pac':verPac(id);break;
    case 'new-wa':fWa();break;case 'edit-wa':fWa(byId('whatsapp',id));break;
    case 'new-svc':fSvc();break;case 'edit-svc':fSvc(byId('servicios',id));break;
    case 'del':confirmDel(el.dataset.col,id);break;
    case 'delok':closeModal();remove(el.dataset.col,id);break;
    case 'more':S.limit+=60;render();break;
    case 'selday':S.selDay=el.dataset.day;render();break;
    case 'mprev':S.agenda=new Date(S.agenda.getFullYear(),S.agenda.getMonth()-1,1);render();break;
    case 'mnext':S.agenda=new Date(S.agenda.getFullYear(),S.agenda.getMonth()+1,1);render();break;
    case 'mtoday':S.agenda=new Date(today().getFullYear(),today().getMonth(),1);S.selDay=TODAY;render();break;
    case 'paid':{const p={...(S.cfg.pagados||{})};p[el.dataset.k]=!p[el.dataset.k];saveCfg({pagados:p});break}
    case 'nologo':saveCfg({logo:''});break;
    case 'golive':goLive();break;
    case 'godemo':S.mode='demo';S.pickedDemo=true;lastView=null;render();break;
    case 'importjson':modal(`<div class="modal-h"><div><h2>Importar respaldo</h2><p>Pega el respaldo copiado desde otro equipo. Reemplaza los datos de este navegador.</p></div><span class="sp"></span><button class="btn icon ghost" data-act="mclose" aria-label="Cerrar">${ic('x')}</button></div><div class="form"><label class="fld span2"><span>Respaldo (JSON)</span><textarea id="impjson" style="min-height:160px"></textarea></label><div class="form-f"><button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn pri" id="imp-ok">${ic('check')}Importar</button></div></div>`);$('#imp-ok').onclick=()=>{try{const j=JSON.parse($('#impjson').value);COLS.forEach(c=>{LIVE[c]=Array.isArray(j[c])?j[c]:[]});if(j.config)S.cfg={...DEFAULT_CFG,...j.config,iniciado:true};else S.cfg.iniciado=true;S.mode='live';closeModal();if(persistLocal())toast('Respaldo importado');lastView=null;render()}catch(err){toast('El texto no es un respaldo válido.',true)}};break;
    case 'copyjson':try{await navigator.clipboard.writeText(JSON.stringify({config:S.cfg,...D()},null,1));toast('Respaldo copiado al portapapeles')}catch(err){toast('El navegador no permitió copiar.',true)}break;
  }});
document.addEventListener('change',e=>{const el=e.target.closest('[data-act="estado"]');if(!el)return;const c=byId('citas',el.dataset.id);if(c)save('citas',{...c,estado:el.value}).then(()=>{if(el.value==='Atendida'&&!D().ventas.some(v=>v.citaId===c.id))fVenta({},{...c,estado:'Atendida'})})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')},{passive:true});
function goLive(){if(!db&&!isLocal()){toast('No hay conexión con el almacenamiento.',true);return}
  modal(`<div class="modal-h"><div><h2>Empezar con tus datos</h2><p>Los datos de ejemplo desaparecen y la plataforma queda lista para registrar la operación real de la clínica.</p></div><span class="sp"></span><button class="btn icon ghost" data-act="mclose" aria-label="Cerrar">${ic('x')}</button></div>
  <label style="display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer"><input type="checkbox" id="keepsvc" checked style="margin-top:3px"><span><b>Usar el catálogo de servicios de la clínica</b><br><span class="muted">Los 8 servicios reales publicados en Instagram, con sus horarios. Solo falta ponerles precio.</span></span></label>
  <div class="form-f" style="margin-top:18px"><button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn pri" id="golive-ok">${ic('check')}Empezar</button></div>`);
  $('#golive-ok').onclick=async()=>{const keep=$('#keepsvc').checked;closeModal();S.mode='live';S.pickedDemo=false;lastView=null;render();
    if(isLocal()){if(keep&&!LIVE.servicios.length)LIVE.servicios=REAL_SVCS.map(x=>({...x}));S.cfg.iniciado=true;if(persistLocal())toast('Listo. Empieza registrando tu primera cita o venta.');render();return}
    try{if(keep&&!LIVE.servicios.length){for(const s of REAL_SVCS){const{id,...b}=s;await db.collection(P('servicios')).doc(id).set(b)}}
      S.cfg.iniciado=true;await db.doc(P('config')+'/general').set({...S.cfg});toast('Listo. Empieza registrando tu primera cita o venta.')}catch(e){dbErr(e)}}}

/* ================= Arranque ================= */
function route(){const h=location.hash.slice(1);S.view=RENDER[h]?h:'resumen';S.limit=40;S.q='';render()}
window.addEventListener('hashchange',route);
route();
initDb();
</script>
</body>
</html>
